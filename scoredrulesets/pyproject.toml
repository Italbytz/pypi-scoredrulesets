[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scoredrulesets"
version = "0.1.0"
description = "Scikit-learn compatible toolkit for scored rule set classification"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "ScoredRuleSets contributors" }
]
keywords = [
  "machine learning",
  "rule learning",
  "interpretable ML",
  "explainable AI",
  "classification",
  "scored rule sets",
  "genetic programming",
  "learning classifier systems",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "numpy>=1.23",
  "scikit-learn>=1.2"
]

[project.urls]
Homepage = "https://github.com/scoredrulesets/scoredrulesets"
Source = "https://github.com/scoredrulesets/scoredrulesets"
"Bug Tracker" = "https://github.com/scoredrulesets/scoredrulesets/issues"

[project.optional-dependencies]
hs = ["imodels>=1.4.0"]
exstracs = ["scikit-ExSTraCS>=3.0"]
rulekit = ["rulekit>=2.0", "jpype1>=1.4"]
all = [
  "scoredrulesets[hs]",
  "scoredrulesets[exstracs]",
  "scoredrulesets[rulekit]",
]
benchmark = [
  "matplotlib>=3.8",
  "pandas>=2.0"
]
benchmark-uci = ["ucimlrepo>=0.0.7"]
benchmark-pmlb = ["pmlb>=1.0"]
dev = [
  "pytest>=7.4",
  "pandas>=2.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "hs: optionaler Integrationstest fuer das HS-Backend (imodels)",
  "exstracs: optionaler Integrationstest fuer das ExSTraCS-Backend (scikit-ExSTraCS)",
  "rulekit: optionaler Integrationstest fuer das RuleKit-Backend (rulekit + jpype1 + Java)",
]

