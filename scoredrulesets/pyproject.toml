[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scoredrulesets"
version = "0.1.0"
description = "Scikit-learn compatible toolkit for scored rule set classification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "ScoredRuleSets contributors" }
]
dependencies = [
  "numpy>=1.23",
  "scikit-learn>=1.2"
]

[project.optional-dependencies]
hs = ["imodels>=1.4.0"]
dev = [
  "pytest>=7.4",
  "pandas>=2.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "hs: optionaler Integrationstest fuer das HS-Backend (imodels)",
]

