name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core dependencies
        run: pip install ".[dev]"

      - name: Run core tests
        run: pytest -q --tb=short --ignore=tests/test_benchmarking.py --ignore=tests/test_benchmark_comparison.py --ignore=tests/test_benchmark_datasets.py

      - name: Run sklearn estimator checks
        run: pytest -q tests/test_estimator_checks.py --tb=short

  test-benchmark:
    name: Benchmark tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install benchmark dependencies
        run: pip install ".[dev,benchmark]"

      - name: Run benchmark test suite
        run: pytest -q tests/test_benchmarking.py tests/test_benchmark_comparison.py tests/test_benchmark_datasets.py --tb=short

  test-hs:
    name: HS backend (imodels)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install with HS backend
        run: pip install ".[dev,hs]"

      - name: Run HS integration tests
        run: pytest -q -m hs --tb=short

  publish:
    name: Publish to PyPI
    needs: [test, test-benchmark]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/scoredrulesets/

    permissions:
      id-token: write   # trusted publishing (no API token needed)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build distribution
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
